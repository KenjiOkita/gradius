<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradius Repro - Antigravity</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="powerup-gauge">
                <div class="gauge-item" id="speed-up">SPEED UP</div>
                <div class="gauge-item" id="missile">MISSILE</div>
                <div class="gauge-item" id="double">DOUBLE</div>
                <div class="gauge-item" id="laser">LASER</div>
                <div class="gauge-item" id="option">OPTION</div>
                <div class="gauge-item" id="shield">SHIELD</div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>

</html>
